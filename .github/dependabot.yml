version: 2

updates:
  # Actualizaciones automáticas de dependencias Python (pip/requirements.txt)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    reviewers:
      - "NicolasVasq"
    labels:
      - "dependencies"
      - "security"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"

  # Actualizaciones de las Actions usadas en los workflows de GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    reviewers:
      - "NicolasVasq"
    labels:
      - "ci"
      - "dependencies"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
