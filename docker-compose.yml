version: '3.9'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: palma-bike-web
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - ALLOWED_HOSTS=*
      - SECRET_KEY=django-insecure-2kgt+u+q@%9_4mpj^1m4n$=41c_6crp7)hfv_y&w^v=9@ebs$n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
