apiVersion: apps/v1
kind: Deployment
metadata:
  name: palma-bike
  namespace: palma-bike
  labels:
    app: palma-bike
spec:
  replicas: 2
  selector:
    matchLabels:
      app: palma-bike
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: palma-bike
    spec:
      containers:
        - name: palma-bike
          image: nicolasvasq/palma-bike-microservicio:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: palma-bike-config
            - secretRef:
                name: palma-bike-secrets
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 10
