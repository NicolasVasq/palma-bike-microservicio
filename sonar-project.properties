sonar.projectKey=NicolasVasq_palma-bike-microservicio
sonar.organization=nicolasvasq
sonar.projectName=Palma Bike Microservicio
sonar.projectVersion=1.0
sonar.sources=.
sonar.exclusions=venv/**,**/__pycache__/**,**/migrations/**,*.pyc,db.sqlite3,files/**,node_modules/**
sonar.python.version=3.13
sonar.python.coverage.reportPaths=coverage.xml
sonar.sourceEncoding=UTF-8

# Exclusion justificada: S5332 (protocolo en texto claro) en el script de
# despliegue EKS. El balanceador del Learner Lab publica HTTP en el puerto 80;
# terminar TLS requeriria un certificado ACM con validacion DNS, inviable con
# el hostname efimero del balanceador de un cluster de vida corta. Decision
# documentada en eks/README.md.
sonar.issue.ignore.multicriteria=e1
sonar.issue.ignore.multicriteria.e1.ruleKey=shell:S5332
sonar.issue.ignore.multicriteria.e1.resourceKey=eks/deploy_eks.sh
