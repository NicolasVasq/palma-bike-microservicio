# StorageClass para el PVC de SQLite en EKS Auto Mode.
# Auto Mode no marca ninguna StorageClass como default, por lo que un PVC
# sin storageClassName queda Pending. Esta clase usa el driver EBS CSI
# gestionado por EKS Auto Mode (provisioner ebs.csi.eks.amazonaws.com) y
# se declara default para que k8s/04-pvc.yml funcione sin modificaciones.
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: palma-bike-gp3
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: ebs.csi.eks.amazonaws.com
parameters:
  type: gp3
  fsType: ext4
reclaimPolicy: Delete
volumeBindingMode: Immediate
